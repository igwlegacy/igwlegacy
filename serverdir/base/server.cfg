//=================================================================
//	Server Config File
//	
//	This gets executed on launching of a dedicated server.
//	Enter all your server specific options and commands in here.
//===================================================================

set sv_hostname "IG:Warlord v1.14 Server"

// Master servers. The Isotx masters are gone (igwmaster2.isotx.com now
// resolves to an unrelated host), so no heartbeats are sent anywhere, and
// the legacy server has no Steam either. Players connect by address
// (connect <host>:<port>).
set sv_master1 ""
set sv_master2 ""
set sv_master3 ""
set sv_master4 ""
set sv_master5 ""

// gametype: 0 = deathmatch, 3 = Scorched earth
set g_gametype 3

// expansion mode: 
// 0 = all expansion features off ( for compatibility with non-expansion clients)
// 1 = enable expansion features and deathmatch gametype
set sv_expansion 1

// net_port is set by start-server.sh (PORT=..., default 27960), it has to
// be known before this file runs.
// rconPassword can also be passed as RCON_PASSWORD=... to start-server.sh.
set rconPassword ""

//Game options
//Max number of humans, 1 - 12
set sv_humanClients 12
set sv_maxclients 12

//Friendly fire. Affects players/bots only.
set g_friendlyfire 0

//Map difficulty, requires a map load to take effect
//0 = easy, 1 = medium, 2 = hard, 3 = brute, 4 = god
set sv_difficulty 1 

//Difficulty multiplier
//For each player (up to 4), bad guys have increased health at spawn
set sv_diffmulti 1

//Run a log file (base/qconsole.log)
// 0 = off, 1 = buffered log file 2 = unbuffered log file
// start-server.sh follows qconsole.log to show the console, keep it at 2.
set logfile 2

//Number of players required to start the round
set sv_minplayers 1

//Punish players for Team Killing, 0 = off, 1 = on, 0 by default
//Gives the victim X power from Attacker
set g_TKpunish 0

//Sets amount power taken from attacker and given to victim, 150 D
set g_TKpunishpower 150

//Sets amount of kills before more severe punishment
set g_TKpunishkills 10

//Once offender has reached half of g_TKpunishkills, they begin losing all power. Frequency is g_TKpunishtimer1.
//Once offender hits threshold, player loses power & upgrades. 
//Once offender > threshold, player loses power & upgrades & all weapons.


//Sets amount of time between kills for, in msec. (1 s = 1000 ms)
set g_TKpunishtimer1 20000

//Sets amount of time allowable between kills that more severe punishments won't take place, in msec. (1 s = 1000 ms)
//Only comes into play after threshold
set g_TKpunishtimer2 60000

//Sets amount of damage to be taken by attacker. In percentage (%).
// Ex. Value set to 50. Player A shoots Player B for 100 damage. Player B receives 100 damage & Player A receives 50.
set g_TKpunishmirrordamage 0

//Allows players to damage buildings, 0 or 1. 0 by default.
//Separate from g_friendlyfire
set g_allowbuildingdamage 0

//=================================================================
//	Netcode
//
//	The network code is id's Quake 3 1.32 code. Limits the engine
//	enforces: a client's "rate" is clamped to 1000..90000 bytes/s and
//	its "snaps" to 1..30, and at most one snapshot per client goes out
//	per server frame.
//===================================================================

// Server frame rate, the game simulation and the snapshot clock. Keep it
// at 20:
// - Snapshots only leave on server frames, so a client's "snaps" only
//   counts when its 1000/snaps msec is a multiple of the server frame.
//   With sv_fps 30, clients on the default "snaps 20" drop to 15
//   snapshots/s (sends at 0, 66, 132 ... msec).
// - NPC movement and its burn damage run once per server frame, so other
//   values change gameplay timing.
// Only consider "sv_fps 30" once every client runs "snaps 30".
set sv_fps 20

// No server side bandwidth cap: every client gets up to the engine's
// maximum of 90000 bytes/s. The legacy client defaults to "rate 90000",
// but a rate saved in an older config.cfg still wins; the stock 25000 is
// already used up by 20 snapshots of 1250 bytes, and NPC waves make
// snapshots bigger than that.
set sv_maxRate 0

// LAN clients are not rate limited at all (rate 99999). Only works while
// "dedicated" is 1, which start-server.sh uses by default.
set sv_lanForceRate 1

// Don't refuse anyone by ping.
set sv_minPing 0
set sv_maxPing 0

// No packet padding, it only wastes bandwidth.
set sv_padPackets 0

// Process client moves as they arrive instead of in lock step with the
// server frame.
set g_synchronousClients 0

// Extrapolate other players between snapshots from their own usercmds,
// so remote players move smoothly.
set g_smoothClients 1

// Player physics stay frame time based (stock). pmove_fixed is pushed to
// the clients, but the cgame's prediction with it is not verified.
set pmove_fixed 0
